[project]
name = "hackalem-meetings"
version = "0.1.0"
description = "Offline-ready meeting minutes backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic-settings>=2.6,<3",
  "python-multipart>=0.0.20,<1", "httpx>=0.28,<1",
  "reportlab>=4.2,<5", "python-docx>=1.1,<2",
]

[project.optional-dependencies]
local = ["faster-whisper>=1.1,<2"]
test = ["pytest>=8,<10", "pypdf>=5,<7", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
